version: "3.8"

services:
  clipsync-relay:
    build:
      context: .
      dockerfile: services/relay/Dockerfile
    container_name: clipsync-relay
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
