<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas: Deep Obsidian / Midnight Slate -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="50%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>

    <!-- Warm Champagne Gold & Tuscan Bronze Gradients -->
    <linearGradient id="goldPrimary" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="25%" stop-color="#f5e6c8" />
      <stop offset="50%" stop-color="#dfb775" />
      <stop offset="75%" stop-color="#c5984f" />
      <stop offset="100%" stop-color="#9a6e2e" />
    </linearGradient>

    <linearGradient id="goldSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb775" />
      <stop offset="40%" stop-color="#c5984f" />
      <stop offset="80%" stop-color="#8c6126" />
      <stop offset="100%" stop-color="#5a3d14" />
    </linearGradient>

    <!-- Subtle Drop Shadow & Glow Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Hairline Rim Light for Luxury Squircle -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#dfb775" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Luxury Squircle Outer Shell (Apple macOS/iOS proportioned) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" filter="url(#softShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#rimLight)" stroke-width="2.5" />

  <!-- Inner Subtle Concentric Precision Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldPrimary)" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 9" />

  <!-- The Interlocking Möbius Monogram: Stylized Synchronized Infinity / Intersecting Paperclip Geometry -->
  <g filter="url(#softShadow)">
    <!-- Node / Arch A: Left Loop -->
    <path
      d="M 230 170
         C 165 170, 118 208, 118 256
         C 118 304, 165 342, 230 342
         C 285 342, 332 308, 388 256
         L 338 256
         C 298 290, 264 314, 230 314
         C 182 314, 148 288, 148 256
         C 148 224, 182 198, 230 198
         C 264 198, 298 222, 338 256
         L 388 256
         C 332 204, 285 170, 230 170 Z"
      fill="url(#goldPrimary)"
    />

    <!-- Node / Arch B: Right Loop (Interlocking Harmonic Symmetry) -->
    <path
      d="M 282 342
         C 347 342, 394 304, 394 256
         C 394 208, 347 170, 282 170
         C 227 170, 180 204, 124 256
         L 174 256
         C 214 222, 248 198, 282 198
         C 330 198, 364 224, 364 256
         C 364 288, 330 314, 282 314
         C 248 314, 214 290, 174 256
         L 124 256
         C 180 308, 227 342, 282 342 Z"
      fill="url(#goldSecondary)"
      opacity="0.94"
    />

    <!-- Precision Sync Jewel at Central Convergence Point -->
    <circle cx="256" cy="256" r="14" fill="url(#goldPrimary)" filter="url(#subtleGlow)" />
    <circle cx="256" cy="256" r="7" fill="#ffffff" />
  </g>
</svg>
