app = "clipsync-relay-raxan"
primary_region = "iad"

[build]
  dockerfile = "services/relay/Dockerfile"

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
